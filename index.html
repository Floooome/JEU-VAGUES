<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#11161d"><title>Vagues</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11161d;color:#e8eef6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;pointer-events:none}.hud>.pill:first-child{justify-self:start}.bar{position:relative;height:20px;width:min(260px,calc(100vw - 2*max(14px,env(safe-area-inset-left)) - 236px));border:2px solid #8fa4bb;border-radius:20px;background:#2a1d24;overflow:hidden;box-shadow:0 2px 12px #0008}.hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#ffffff;text-shadow:0 1px 2px #000d,0 0 6px #000a;font-variant-numeric:tabular-nums;letter-spacing:.02em}.fill{height:100%;background:linear-gradient(90deg,#d95765,#f3ad82);width:100%;transition:width .15s}.pill{padding:6px 11px;background:#18202bcc;border:1px solid #5b6f8788;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 4px 16px #0005}.topright{justify-self:end}
.overlay{position:absolute;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));background:#0a0e14c4;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.hidden{display:none}.panel{margin:auto;width:min(440px,100%);padding:27px 24px;background:linear-gradient(160deg,#222c3a,#161c26);border:2px solid #4a5d75;border-radius:22px;text-align:center;box-shadow:0 22px 70px #000a,inset 0 1px #ffffff25;animation:rise .25s ease-out}@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1{font-size:clamp(28px,7vw,38px);font-weight:800;letter-spacing:.01em;line-height:1.08;margin:4px 0 12px;color:#f2f7ff}p{line-height:1.5;color:#c3ccd8;margin:10px 0 20px;font-size:15px}
.button,.choice{appearance:none;border:1px solid #7fdcff;color:#0d1a24;background:linear-gradient(#8ae6ff,#3fb3e0);border-radius:13px;font-weight:800;font-size:16px;padding:13px 18px;cursor:pointer;width:100%;min-height:49px;transition:opacity .2s}.button:active,.choice:active{transform:scale(.98)}.button:disabled,.choice:disabled{opacity:.45;cursor:default;transform:none}.choices{display:grid;gap:10px;text-align:left}.choice{background:#1d2735;color:#e8eef6;text-align:left;padding:12px 14px}.choice strong{display:block;color:#7fdcff;font-size:17px}.choice span{display:block;font-size:13px;font-weight:400;color:#c3ccd8;margin-top:3px}.small{font-size:12px;color:#8f9bab;margin:14px 0 0}
.wavebanner{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:26px;font-weight:800;letter-spacing:.02em;color:#e6f7ff;text-shadow:0 2px 18px #000;pointer-events:none;opacity:0;transition:opacity .3s}.wavebanner.show{opacity:1}
.pause{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:max(17px,env(safe-area-inset-right));border:1px solid #6d829b;background:#1b2431c9;color:#e8eef6;border-radius:50%;width:48px;height:48px;font-size:19px;cursor:pointer}.pause.hidden{display:none}.hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:max(17px,env(safe-area-inset-left));right:80px;color:#c9d3dfa8;font-size:12px;pointer-events:none}#overlay:not(.hidden){z-index:5}.version{position:absolute;bottom:max(4px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));z-index:6;font-size:10px;letter-spacing:.04em;color:#c9d3df;opacity:.4;pointer-events:none}@media(min-width:700px){.hint{font-size:14px}}@media(max-width:420px){.hud .pill{font-size:12px;padding:5px 9px}.hud{gap:6px}}@media(max-width:340px){.hptext{font-size:10px}}
@media(max-height:520px) and (orientation:landscape){.panel{width:min(760px,100%);padding:16px 20px}h1{font-size:25px;margin:2px 0 6px}p{margin:4px 0 12px;font-size:14px}.choices{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.choice{min-height:0}.wavebanner{top:16%;font-size:24px}}
</style></head><body><canvas id="game" aria-label="Arène de jeu"></canvas><div class="hud"><div class="pill" id="wave">Vague 1/10</div><div class="bar"><div class="fill" id="health"></div><div class="hptext" id="hptext">100/100</div></div><div class="pill topright" id="kills">0 ✦</div></div><div class="wavebanner" id="banner"></div><div class="hint" id="hint">Glisser pour déplacer le robot · tir automatique</div><div class="version">v0.03</div><button class="pause hidden" id="pause" aria-label="Pause">Ⅱ</button><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),panel=$('panel'),banner=$('banner'),hud=document.querySelector('.hud');
const waveEl=$('wave'),hpEl=$('health'),hpText=$('hptext'),killsEl=$('kills'),pauseEl=$('pause'),hint=$('hint');
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
// Les boss s'arrêtent et annoncent leur attaque BOSS_WINDUP secondes avant de frapper : elle peut s'esquiver.
const BOSS_WINDUP=.8,SHOT_SPEED=460,SAFE_SPAWN=230;
// Composition des vagues : nombre d'ennemis, intervalle d'apparition (s) et multiplicateur de PV des ennemis.
// Vagues 1 à 5 : premier boss. Vagues 6 à 10 : tireurs à distance, puis boss final.
const WAVES={1:{count:10,every:.8},2:{count:11,every:.85},3:{count:14,every:.75},4:{count:17,every:.65},5:{count:16,every:.56},
  6:{count:16,every:.62,hp:1.3},7:{count:18,every:.56,hp:1.45},8:{count:20,every:.5,hp:1.6},9:{count:22,every:.46,hp:1.75},10:{count:18,every:.5,hp:1.9}};
const FINAL_WAVE=10;
const BOSSES={5:{type:'boss',name:'Boss',defeated:'Boss vaincu !',next:'Les vagues suivantes sont plus difficiles.'},
  10:{type:'queen',name:'Boss final'}};
// Clé de stockage conservée telle quelle pour garder les records déjà enregistrés.
const BETWEEN_HEAL=.15,BEST_KEY='clairiere-des-brumes:record';
let W=0,H=0,SW=0,SH=0,S=1,dpr=1,hudBottom=50,last=0,clock=0,state='menu',wave=1,spawned=0,spawnTimer=0,between=0,kills=0,bossSpawned=false,bannerTimer=0;
let projectiles=[],bolts=[],enemies=[],particles=[],rings=[],texts=[],shake=0,hurtFlash=0,keys={},pointer=null,joy=null,player=null;
const newPlayer=()=>({x:W/2,y:H/2,r:15,hp:100,maxHp:100,speed:210,damage:24,rate:.57,range:350,shots:1,shield:0,fire:0,inv:0});

// Le monde est mesuré en unités de jeu : environ 400 unités sur le petit côté de l'écran.
// Vitesses, portée et distances restent ainsi comparables d'un téléphone à l'autre (zoom plafonné sur grand écran).
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;S=clamp(Math.min(SW,SH)/400,.8,1.6);W=SW/S;H=SH/S;
  canvas.width=Math.round(SW*dpr);canvas.height=Math.round(SH*dpr);
  hudBottom=hud.getBoundingClientRect().bottom/S;
  if(state==='menu'&&player){player.x=W/2;player.y=H/2}
}
addEventListener('resize',resize);resize();player=newPlayer();

// --- Panneaux, bannière, pause ---
function releaseInput(){pointer=null;joy=null;keys={}}
// armDelay (ms) : les boutons restent inactifs un instant, pour qu'un tap réflexe pendant le combat ne choisisse pas à la place du joueur.
function setPanel(html,armDelay=0){
  panel.innerHTML=html;overlay.classList.remove('hidden');overlay.scrollTop=0;pauseEl.classList.add('hidden');releaseInput();
  if(armDelay>0){const buttons=[...panel.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);setTimeout(()=>buttons.forEach(b=>b.disabled=false),armDelay)}
}
function hidePanel(){overlay.classList.add('hidden');pauseEl.classList.remove('hidden')}
function announce(t){clearTimeout(bannerTimer);banner.textContent=t;banner.classList.add('show');bannerTimer=setTimeout(()=>banner.classList.remove('show'),1600)}
function loadBest(){try{return JSON.parse(localStorage.getItem(BEST_KEY))}catch(e){return null}}
function saveBest(run){try{localStorage.setItem(BEST_KEY,JSON.stringify(run))}catch(e){}}
const runScore=r=>r?(r.won?r.wave+1:r.wave)*1000+r.kills:-1;
const describeRun=r=>(r.won&&r.wave>=FINAL_WAVE?'victoire':'vague '+r.wave)+' · '+r.kills+' ennemis';
function bestLine(){const b=loadBest();return b?'<div class="small">Record : '+describeRun(b)+'</div>':''}
function pause(){if(state!=='playing')return;state='paused';setPanel('<h1>Pause</h1><p>Le jeu est en pause.</p><button class="button" id="resume">Reprendre</button>');$('resume').onclick=resume}
function resume(){if(state!=='paused')return;state='playing';hidePanel()}
pauseEl.onclick=pause;
// Pause automatique : appel, notification, changement d'appli ou d'onglet.
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',pause);

// --- Déroulement d'une partie ---
function reset(){wave=1;spawned=0;spawnTimer=.8;between=0;kills=0;clock=0;bossSpawned=false;projectiles=[];bolts=[];enemies=[];particles=[];rings=[];texts=[];shake=0;hurtFlash=0;player=newPlayer();state='playing';hidePanel();hint.style.display='block';announce('Vague 1')}
function menu(){state='menu';setPanel('<h1>Vagues</h1><p>Survis à dix vagues d’ennemis et bats les deux boss. Déplace le robot du bout du doigt : il tire automatiquement sur les ennemis proches.</p><button class="button" id="start">Jouer</button>'+bestLine()+'<div class="small">Sur ordinateur : flèches ou ZQSD / WASD · Échap pour la pause</div>');$('start').onclick=reset}
const upgrades=[
  {name:'▲ Puissance',desc:'+35 % de dégâts',apply:()=>player.damage*=1.35},
  {name:'⚡ Cadence',desc:'Tirs 22 % plus fréquents',apply:()=>player.rate=Math.max(.18,player.rate*.78),available:()=>player.rate>.19},
  {name:'» Vitesse',desc:'+18 % de vitesse de déplacement',apply:()=>player.speed*=1.18,available:()=>player.speed<380},
  {name:'✚ Réparation',desc:'+25 PV maximum et répare 35 PV',apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+35)}},
  {name:'⁑ Tir multiple',desc:'Un projectile supplémentaire par tir',apply:()=>player.shots=Math.min(5,player.shots+1),available:()=>player.shots<5},
  {name:'■ Blindage',desc:'Réduit les dégâts reçus de 15 %',apply:()=>player.shield=Math.min(.6,player.shield+.15),available:()=>player.shield<.59},
  {name:'◎ Portée',desc:'+25 % de portée de tir',apply:()=>player.range*=1.25,available:()=>player.range<650}
];
function chooseUpgrade(){
  state='upgrade';
  // Tirage sans biais parmi les améliorations encore utiles (les bonus déjà au maximum sont exclus).
  const pool=upgrades.filter(u=>!u.available||u.available());
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  pool.length=Math.min(3,pool.length);
  const healed=Math.round(Math.min(player.maxHp-player.hp,player.maxHp*BETWEEN_HEAL));player.hp+=healed;refreshHud();
  const boss=BOSSES[wave];
  setPanel('<h1>'+(boss?boss.defeated:'Vague '+wave+' terminée')+'</h1><p>'+(boss?boss.next+' ':'')+(healed>0?'Réparation automatique : +'+healed+' PV. ':'')+'Choisis une amélioration.</p><div class="choices">'+pool.map((u,i)=>'<button class="choice" data-i="'+i+'"><strong>'+u.name+'</strong><span>'+u.desc+'</span></button>').join('')+'</div>',600);
  panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{pool[+b.dataset.i].apply();wave++;spawned=0;spawnTimer=1;between=0;state='playing';bossSpawned=false;hidePanel();announce(BOSSES[wave]?'Vague '+wave+' · '+BOSSES[wave].name:wave===6?'Vague 6 · Nouveaux ennemis':'Vague '+wave)});
}
function end(win){
  state=win?'won':'lost';refreshHud();buzz(win?[30,60,30]:120);
  const run={wave,kills,won:win},prev=loadBest(),record=runScore(run)>runScore(prev);
  if(record)saveBest(run);
  const recordLine=record&&prev?'<div class="small" style="color:#f5ce85">✦ Nouveau record ! (avant : '+describeRun(prev)+')</div>':record?'':bestLine();
  setPanel('<h1>'+(win?'Victoire !':'Robot détruit')+'</h1><p>'+(win?'Les deux boss sont vaincus. '+kills+' ennemis détruits.':'Tu as atteint la vague '+wave+' et détruit '+kills+' ennemis.')+'</p><button class="button" id="again">Rejouer</button>'+recordLine,800);
  $('again').onclick=reset;
}

// --- Simulation ---
function edgePoint(){const side=Math.floor(Math.random()*4),pad=35;return{x:side===0?-pad:side===1?W+pad:rand(0,W),y:side===2?-pad:side===3?H+pad:rand(0,H)}}
function createEnemy(type){
  // Plusieurs tirages : on garde le premier point assez loin du robot, sinon le plus éloigné.
  let best=null,bestD=-1;
  for(let i=0;i<8;i++){const c=edgePoint(),d=Math.hypot(c.x-player.x,c.y-player.y);if(d>bestD){best=c;bestD=d}if(d>=SAFE_SPAWN)break}
  let {x,y}=best;
  const specs={
    boss:{r:34,hp:600,speed:48,damage:23,color:'#a85d9b',boss:true,blastR:125,cycle:['blast'],every:2.6},
    queen:{r:38,hp:1500,speed:55,damage:26,color:'#6f8f4a',boss:true,blastR:145,cycle:['volley','blast'],every:2.2},
    caster:{r:14,hp:45+wave*7,speed:72,damage:10,color:'#7a6aa8'}
  };
  if(specs[type]&&specs[type].boss){x=W/2;y=player.y<H/2?H+60:-60}
  let spec=specs[type]?{...specs[type]}:type==='brute'?{r:21,hp:82+wave*12,speed:61+wave*3,damage:17,color:'#a57759'}:type==='wisp'?{r:11,hp:26+wave*5,speed:125+wave*5,damage:9,color:'#b6d1a8'}:{r:15,hp:40+wave*7,speed:88+wave*4,damage:11,color:'#9cbaa4'};
  if(!spec.boss)spec.hp*=WAVES[wave].hp||1;
  enemies.push({x,y,type,...spec,maxHp:spec.hp,hit:0,phase:rand(0,6),attack:spec.boss?3:type==='caster'?1.8:0,step:0,inside:false});
}
// Projectile ennemi : lent et bien visible, pour laisser le temps de l'esquiver au doigt.
function shootBolt(x,y,angle,speed,damage){bolts.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:7,damage,life:5})}
function burst(x,y,color,n=9){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-90,90),vy:rand(-90,90),life:rand(.25,.65),max:.65,color,r:rand(2,5)})}
function floatText(x,y,text,color,size=14){texts.push({x:x+rand(-6,6),y,text,color,size,life:.75})}
function hurtPlayer(amount,color){
  if(player.inv>0||state!=='playing')return;
  const taken=amount*(1-player.shield);
  player.hp-=taken;player.inv=.7;burst(player.x,player.y,color,10);buzz(35);
  shake=Math.min(10,shake+6);hurtFlash=.35;floatText(player.x,player.y-30,'-'+Math.round(taken),'#ff9c8f',16);
  if(player.hp<=0){player.hp=0;end(false)}
}
function refreshHud(){waveEl.textContent='Vague '+wave+'/'+FINAL_WAVE;hpEl.style.width=(100*player.hp/player.maxHp)+'%';hpText.textContent=Math.ceil(player.hp)+'/'+Math.round(player.maxHp);killsEl.textContent=kills+' ✦'}
function update(dt){
  clock+=dt;player.inv=Math.max(0,player.inv-dt);player.fire-=dt;
  let mx=0,my=0;
  if(keys.ArrowLeft||keys.a||keys.q)mx--;if(keys.ArrowRight||keys.d)mx++;if(keys.ArrowUp||keys.w||keys.z)my--;if(keys.ArrowDown||keys.s)my++;
  if(joy){mx+=joy.dx;my+=joy.dy}
  const len=Math.hypot(mx,my);
  if(len>0){player.x+=mx/Math.max(1,len)*player.speed*dt;player.y+=my/Math.max(1,len)*player.speed*dt}
  player.x=clamp(player.x,player.r+8,W-player.r-8);player.y=clamp(player.y,hudBottom+38,H-player.r-8);

  const total=WAVES[wave].count;
  if(spawned<total){spawnTimer-=dt;if(spawnTimer<=0){let type=wave>=6&&spawned%5===1?'caster':wave>=3&&spawned%6===4?'brute':(wave>=2&&spawned%4===2)||(wave===1&&spawned%5===3)?'wisp':'goblin';createEnemy(type);spawned++;spawnTimer=WAVES[wave].every}}
  else if(BOSSES[wave]&&!bossSpawned){createEnemy(BOSSES[wave].type);bossSpawned=true;announce(BOSSES[wave].name+' apparaît !')}

  if(player.fire<=0&&enemies.length){
    let targets=enemies.filter(e=>Math.hypot(e.x-player.x,e.y-player.y)<player.range).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y));
    if(targets.length){
      for(let i=0;i<player.shots;i++){let e=targets[Math.min(i,targets.length-1)],angle=Math.atan2(e.y-player.y,e.x-player.x)+(i>0&&targets.length===1?(i-(player.shots-1)/2)*.17:0);projectiles.push({x:player.x,y:player.y,vx:Math.cos(angle)*SHOT_SPEED,vy:Math.sin(angle)*SHOT_SPEED,life:1.1,damage:player.damage,r:5})}
      player.fire=player.rate;rings.push({x:player.x,y:player.y,r:13,life:.17});
    }
  }
  for(let i=projectiles.length-1;i>=0;i--){
    let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    let hit=enemies.find(e=>Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r);
    if(hit){
      hit.hp-=p.damage;hit.hit=.12;burst(p.x,p.y,'#9fe9ff',4);floatText(hit.x,hit.y-hit.r-8,Math.round(p.damage),'#e6f7ff');projectiles.splice(i,1);
      const push=hit.boss?1:hit.type==='brute'?4:8;hit.x+=p.vx/SHOT_SPEED*push;hit.y+=p.vy/SHOT_SPEED*push;
      if(hit.hp<=0){burst(hit.x,hit.y,hit.color,15);enemies.splice(enemies.indexOf(hit),1);kills++;if(hit.boss)shake=Math.min(12,shake+10)}
    }
    else if(p.life<=0||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)projectiles.splice(i,1);
  }
  for(const e of enemies){
    if(state!=='playing')break;
    e.hit=Math.max(0,e.hit-dt);e.phase+=dt;
    let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    const windingUp=e.boss&&e.attack<BOSS_WINDUP;
    // Le sorcier garde ses distances : il avance, recule ou reste sur place selon l'éloignement du robot.
    const dir=e.type==='caster'?(d>230?1:d<160?-1:0):1;
    if(d>e.r+player.r-3){if(!windingUp){e.x+=dx/d*e.speed*dt*dir;e.y+=dy/d*e.speed*dt*dir}}else hurtPlayer(e.damage,'#f2938a');
    if(e.type==='caster'){
      if(!e.inside&&e.x>e.r&&e.x<W-e.r&&e.y>hudBottom&&e.y<H-e.r)e.inside=true;
      if(e.inside){e.x=clamp(e.x,e.r,W-e.r);e.y=clamp(e.y,hudBottom,H-e.r)}
      e.attack-=dt;if(e.attack<=0&&e.inside){e.attack=2.6;shootBolt(e.x,e.y,Math.atan2(dy,dx),150,12)}
    }
    if(e.boss){e.attack-=dt;if(e.attack<=0){
      const move=e.cycle[e.step%e.cycle.length];e.step++;e.attack=e.every;shake=Math.min(12,shake+5);
      if(move==='blast'){rings.push({x:e.x,y:e.y,r:e.r,R:e.blastR,life:.3,boss:true});if(d<e.blastR)hurtPlayer(17,'#d38ec0')}
      else{const a0=rand(0,Math.PI);for(let k=0;k<14;k++)shootBolt(e.x,e.y,a0+k*Math.PI*2/14,140,13)}
    }}
  }
  // Les ennemis se repoussent entre eux au lieu de se fondre en une seule masse ; le boss ne bouge pas.
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i],b=enemies[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,overlap=a.r+b.r-d;
    if(overlap>0){const share=a.boss?0:b.boss?1:.5;dx/=d;dy/=d;a.x-=dx*overlap*share;a.y-=dy*overlap*share;b.x+=dx*overlap*(1-share);b.y+=dy*overlap*(1-share)}
  }
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.hypot(b.x-player.x,b.y-player.y)<b.r+player.r-2){hurtPlayer(b.damage,'#b9dc86');bolts.splice(i,1)}
    else if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)bolts.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=34*dt;t.life-=dt;if(t.life<=0)texts.splice(i,1)}
  shake=Math.max(0,shake-dt*30);hurtFlash=Math.max(0,hurtFlash-dt);
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1)}
  if(state==='playing'&&spawned===total&&enemies.length===0&&(!BOSSES[wave]||bossSpawned)){if(wave===FINAL_WAVE)end(true);else{between+=dt;if(between>.8)chooseUpgrade()}}
  refreshHud();
}

// --- Rendu ---
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function rrect(x,y,w,h,r,color){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
// Petit robot : corps, tête à visière, antenne dont la bille s'allume à chaque tir. Il clignote en rose quand il est touché.
function drawRobot(){
  const x=player.x,y=player.y,hurt=player.inv>0&&Math.floor(clock*12)%2,metal=hurt?'#f7b7ab':'#a9bacb',dark=hurt?'#c98a84':'#6f8296';
  const bob=Math.sin(clock*8)*(joy||Object.values(keys).some(Boolean)?1.2:.4),glow=Math.max(0,1-(player.rate-player.fire)/.18);
  ctx.globalAlpha=.4;ctx.beginPath();ctx.ellipse(x,y+16,14,4.5,0,0,Math.PI*2);ctx.fillStyle='#05080c';ctx.fill();ctx.globalAlpha=1;
  rrect(x-11,y+9,8,6,2,dark);rrect(x+3,y+9,8,6,2,dark);
  rrect(x-17,y-2+bob,5,10,2,dark);rrect(x+12,y-2+bob,5,10,2,dark);
  rrect(x-12,y-4+bob,24,16,5,metal);circle(x,y+4+bob,2.5,'#5ff2ff');
  const hy=y-20+bob*1.3;
  ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,hy);ctx.lineTo(x,hy-10);ctx.stroke();
  if(glow>0){ctx.globalAlpha=.5*glow;circle(x,hy-12,8,'#7fe9ff');ctx.globalAlpha=1}
  circle(x,hy-12,3.5,glow>0?'#dffaff':'#ff6b6b');
  rrect(x-11,hy,22,15,5,metal);rrect(x-8,hy+4,16,7,3.5,'#172230');
  circle(x-3.5,hy+7.5,1.8,'#5ff2ff');circle(x+3.5,hy+7.5,1.8,'#5ff2ff');
}
function draw(){
  const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;
  ctx.setTransform(dpr*S,0,0,dpr*S,sx*dpr*S,sy*dpr*S);
  ctx.fillStyle='#151b24';ctx.fillRect(-20,-20,W+40,H+40);let gradient=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.68);gradient.addColorStop(0,'#232d3b');gradient.addColorStop(1,'#12171f');ctx.fillStyle=gradient;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='#8aa0b818';ctx.lineWidth=2;for(let x=0;x<W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const r of rings){ctx.globalAlpha=Math.max(0,r.life*1.7);ctx.strokeStyle=r.boss?'#e8a2d0':'#7fe3ff';ctx.lineWidth=r.boss?6:2;ctx.beginPath();ctx.arc(r.x,r.y,r.boss?r.R-(r.R-r.r)*r.life/.3:r.r+(.17-r.life)*80,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
  // Annonce des attaques de boss : zone qui se remplit (onde) ou épines qui poussent (salve de projectiles).
  for(const e of enemies)if(e.boss&&e.attack<BOSS_WINDUP){
    const k=1-e.attack/BOSS_WINDUP,move=e.cycle[e.step%e.cycle.length],tint=e.type==='queen'?'#c6e59a':'#e8a2d0';
    if(move==='blast'){
      ctx.globalAlpha=.16+.14*k;circle(e.x,e.y,e.blastR*k,tint);
      ctx.globalAlpha=.55+.4*Math.sin(clock*30)*k;ctx.strokeStyle=tint;ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(e.x,e.y,e.blastR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }else{
      ctx.globalAlpha=.5+.5*k;ctx.strokeStyle=tint;ctx.lineWidth=4;ctx.lineCap='round';
      for(let a=0;a<14;a++){const ang=a*Math.PI*2/14+clock*.6,r0=e.r+6,r1=e.r+6+26*k;ctx.beginPath();ctx.moveTo(e.x+Math.cos(ang)*r0,e.y+Math.sin(ang)*r0);ctx.lineTo(e.x+Math.cos(ang)*r1,e.y+Math.sin(ang)*r1);ctx.stroke()}
      ctx.lineCap='butt';
    }
    ctx.globalAlpha=1;
  }
  for(const e of enemies){
    circle(e.x,e.y+6,e.r+3,'#0d20248a');circle(e.x,e.y,e.r,e.hit>0?'#fff1dc':e.color);
    if(e.type==='boss'){circle(e.x,e.y-4,23,'#684c77');ctx.fillStyle='#d3acd3';ctx.beginPath();ctx.moveTo(e.x-26,e.y-19);ctx.lineTo(e.x-17,e.y-45);ctx.lineTo(e.x-8,e.y-24);ctx.lineTo(e.x+8,e.y-24);ctx.lineTo(e.x+17,e.y-45);ctx.lineTo(e.x+26,e.y-19);ctx.fill();circle(e.x-10,e.y-4,4,'#ffe4a1');circle(e.x+10,e.y-4,4,'#ffe4a1')}
    else if(e.type==='queen'){circle(e.x,e.y-2,25,'#3f5a33');ctx.fillStyle='#b6d77e';for(let k=0;k<5;k++){const bx=e.x-24+k*12;ctx.beginPath();ctx.moveTo(bx-5,e.y-22);ctx.lineTo(bx,e.y-(k%2?38:48));ctx.lineTo(bx+5,e.y-22);ctx.fill()}circle(e.x-10,e.y-3,4,'#f3f0a0');circle(e.x+10,e.y-3,4,'#f3f0a0');circle(e.x,e.y+12,5,'#d2667a')}
    else if(e.type==='caster'){circle(e.x,e.y-3,9,'#3d3160');ctx.fillStyle='#51437f';ctx.beginPath();ctx.moveTo(e.x-12,e.y-6);ctx.lineTo(e.x,e.y-28);ctx.lineTo(e.x+12,e.y-6);ctx.fill();circle(e.x-4,e.y-2,2,'#c8f08a');circle(e.x+4,e.y-2,2,'#c8f08a');circle(e.x+13,e.y-6,e.attack<.5&&e.inside?6:4,e.attack<.5&&e.inside?'#e6ff9e':'#9fce6a')}
    else if(e.type==='wisp'){circle(e.x,e.y,6,'#e5efb5');circle(e.x-4,e.y-2,2,'#fff')}
    else{circle(e.x-5,e.y-3,2,'#f6e1a5');circle(e.x+5,e.y-3,2,'#f6e1a5');if(e.type==='brute'){ctx.fillStyle='#c5a277';ctx.fillRect(e.x-17,e.y-23,34,8)}}
    if(e.hp<e.maxHp){ctx.fillStyle='#251d29';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2,4);ctx.fillStyle='#e89b83';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2*e.hp/e.maxHp,4)}
  }
  for(const b of bolts){circle(b.x,b.y,b.r+5,'#a9d86a44');circle(b.x,b.y,b.r,'#cfee8f');circle(b.x,b.y,b.r-3,'#f7ffe0')}
  for(const p of projectiles){circle(p.x,p.y,9,'#6fdcff44');circle(p.x,p.y,p.r,'#bff3ff')}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);circle(p.x,p.y,p.r,p.color)}ctx.globalAlpha=1;
  drawRobot();
  ctx.textAlign='center';for(const t of texts){ctx.globalAlpha=Math.min(1,t.life/.3);ctx.font='800 '+t.size+'px system-ui,sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#10202699';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}ctx.globalAlpha=1;
  // Le reste est dessiné en pixels d'écran (le joystick suit le doigt).
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(hurtFlash>0){const v=ctx.createRadialGradient(SW/2,SH/2,Math.min(SW,SH)*.3,SW/2,SH/2,Math.max(SW,SH)*.75);v.addColorStop(0,'#c0303000');v.addColorStop(1,'rgba(200,40,50,'+(hurtFlash*1.3).toFixed(2)+')');ctx.fillStyle=v;ctx.fillRect(0,0,SW,SH)}
  if(joy){ctx.strokeStyle='#eedba487';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.x,joy.y,43,0,7);ctx.stroke();circle(joy.x+joy.dx*35,joy.y+joy.dy*35,16,'#e8d5a766')}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(state==='playing')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

// --- Contrôles ---
function startPointer(e){if(state!=='playing')return;pointer=e.pointerId;joy={x:e.clientX,y:e.clientY,dx:0,dy:0};canvas.setPointerCapture(e.pointerId);hint.style.display='none'}
canvas.addEventListener('pointerdown',startPointer);
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!joy)return;let dx=e.clientX-joy.x,dy=e.clientY-joy.y,d=Math.hypot(dx,dy);joy.dx=dx/Math.max(d,45);joy.dy=dy/Math.max(d,45)});
function release(e){if(e.pointerId===pointer){pointer=null;joy=null}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
// Les lettres sont normalisées en minuscules : Maj ou Verr. Maj ne laissent plus de touche « coincée ».
const keyName=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{keys[keyName(e)]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){if(state==='playing')pause();else resume()}});
addEventListener('keyup',e=>keys[keyName(e)]=false);
menu();
})();
</script></body></html>
